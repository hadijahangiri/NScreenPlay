name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Least-privilege: read-only by default; jobs override only what they need
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # windows-latest: full suite including Login (with Playwright)
        # ubuntu-24.04: framework tests (no browser â€” all NSubstitute mocks)
        os: [ windows-latest, ubuntu-24.04 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        # Use .sln for broad compatibility; .slnx is .NET 10+ only
        run: dotnet restore NScreenplay.sln

      - name: Build Debug (warnings as errors)
        run: dotnet build NScreenplay.sln --no-restore -warnaserror -p:EnforceCodeStyleInBuild=false

      - name: Test Debug
        # dotnet test against explicit project dirs â€” excludes samples/ (requires Playwright browser)
        run: |
          dotnet test tests/NScreenplay.Core.Tests           --no-build -v minimal
          dotnet test tests/NScreenplay.Mcp.Tests            --no-build -v minimal
          dotnet test tests/NScreenplay.Playwright.Tests     --no-build -v minimal
          dotnet test tests/NScreenplay.Reqnroll.Tests       --no-build -v minimal

      - name: Build Release (warnings as errors)
        run: dotnet build NScreenplay.sln -c Release --no-restore -warnaserror -p:EnforceCodeStyleInBuild=false

      - name: Test Release
        # same explicit scope as Debug â€” keeps parity, excludes samples/
        run: |
          dotnet test tests/NScreenplay.Core.Tests           -c Release --no-build -v minimal
          dotnet test tests/NScreenplay.Mcp.Tests            -c Release --no-build -v minimal
          dotnet test tests/NScreenplay.Playwright.Tests     -c Release --no-build -v minimal
          dotnet test tests/NScreenplay.Reqnroll.Tests       -c Release --no-build -v minimal

      - name: Install Playwright Chromium
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ps1 = Get-ChildItem -Recurse -Path samples/Login/bin/Release -Filter playwright.ps1 -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if ($ps1) { powershell -File $ps1 install chromium }
          else { Write-Warning "playwright.ps1 not found; skipping browser install" }

      - name: Test Login Sample (Windows only)
        if: matrix.os == 'windows-latest'
        run: dotnet test samples/Login/Login.csproj -c Release --no-build -v minimal

  package-validation:
    name: Package Validation
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NScreenplay.sln

      - name: Build Release
        run: dotnet build NScreenplay.sln -c Release --no-restore -warnaserror -p:EnforceCodeStyleInBuild=false

      - name: Pack
        run: |
          dotnet pack src/NScreenplay.Core/NScreenplay.Core.csproj -c Release --no-build -o artifacts/
          dotnet pack src/NScreenplay.Playwright/NScreenplay.Playwright.csproj -c Release --no-build -o artifacts/
          dotnet pack src/NScreenplay.Reqnroll/NScreenplay.Reqnroll.csproj -c Release --no-build -o artifacts/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs-${{ github.run_id }}
          path: artifacts/*.nupkg
          retention-days: 30
          if-no-files-found: error
