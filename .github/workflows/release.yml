name: Release

# Triggered by:
# 1. Published GitHub Release (automatic)
# 2. Manual workflow_dispatch with release_tag input (manual)
# Never publish automatically from a push.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to build and publish'
        default: 'v0.1.0'
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Resolve release tag from either release event or manual input
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

# Minimum permissions required for OIDC NuGet Trusted Publishing.
# id-token: write  — obtain GitHub OIDC token to authenticate with NuGet
# contents: read   — checkout the repository
permissions:
  contents: read
  id-token: write

jobs:

  release:
    name: Build, Test, Pack & Publish
    runs-on: windows-latest
    # No GitHub Environment — must be absent to match NuGet Trusted Publishing policy:
    #   Repository: hadijahangiri/NScreenPlay
    #   Workflow: release.yml
    #   Environment: (none)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NScreenplay.slnx

      - name: Build Release (warnings as errors)
        run: dotnet build NScreenplay.slnx -c Release --no-restore -warnaserror -p:EnforceCodeStyleInBuild=false

      - name: Test Release
        # Explicit project list excludes samples/ which requires a Playwright browser
        run: |
          dotnet test tests/NScreenplay.Core.Tests           -c Release --no-build -v minimal
          dotnet test tests/NScreenplay.Mcp.Tests            -c Release --no-build -v minimal
          dotnet test tests/NScreenplay.Playwright.Tests     -c Release --no-build -v minimal
          dotnet test tests/NScreenplay.Reqnroll.Tests       -c Release --no-build -v minimal

      - name: Install Playwright Chromium (for Login sample test)
        shell: pwsh
        run: |
          $ps1 = Get-ChildItem -Recurse -Path samples/Login/bin/Release -Filter playwright.ps1 -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if ($ps1) { powershell -File $ps1 install chromium }
          else { Write-Warning "playwright.ps1 not found; skipping browser install" }

      - name: Test Login Sample (full e2e with Playwright)
        run: dotnet test samples/Login/Login.csproj -c Release --no-build -v minimal

      - name: Pack
        # Only the three public NScreenplay packages — no MCP, no tests, no samples
        run: |
          dotnet pack src/NScreenplay.Core/NScreenplay.Core.csproj         -c Release --no-build -o artifacts/
          dotnet pack src/NScreenplay.Playwright/NScreenplay.Playwright.csproj -c Release --no-build -o artifacts/
          dotnet pack src/NScreenplay.Reqnroll/NScreenplay.Reqnroll.csproj -c Release --no-build -o artifacts/

      - name: Validate packages
        # Verify expected package IDs (version-agnostic) and no unexpected files
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem artifacts/*.nupkg
          Write-Host "Generated packages:"
          $pkgs | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1024,1)) KB)" }

          $expectedIds = @("NScreenplay.Core", "NScreenplay.Playwright", "NScreenplay.Reqnroll")
          foreach ($id in $expectedIds) {
            $matches = Get-ChildItem "artifacts/$id.*.nupkg" -ErrorAction SilentlyContinue
            if (-not $matches) {
              Write-Error "Expected package missing for id: $id"
              exit 1
            }
          }
          Write-Host "All expected package IDs present."

          # Verify no unexpected packages (e.g. debug, test, MCP, samples)
          $unexpected = $pkgs | Where-Object { $_.Name -notmatch '^NScreenplay\.(Core|Playwright|Reqnroll)\.' }
          if ($unexpected) {
            Write-Error "Unexpected packages found: $($unexpected.Name -join ', ')"
            exit 1
          }
          Write-Host "Package validation passed."

      - name: Upload packages (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.run_id }}
          path: artifacts/*.nupkg
          if-no-files-found: error

      # NuGet Trusted Publishing via GitHub OIDC.
      # Exchanges GitHub OIDC token for short-lived NuGet API key.
      # The NuGet Trusted Publishing policy must be configured at nuget.org with:
      #   Repository owner: hadijahangiri
      #   Repository:       NScreenPlay
      #   Workflow file:    release.yml
      #   Environment:      (none)
      - name: Authenticate with NuGet (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: NScreenPlay
          audience: https://www.nuget.org

      - name: List package files to publish
        shell: pwsh
        run: |
          Write-Host "Listing artifacts directory contents"
          $files = Get-ChildItem -Path "artifacts\*.nupkg" -File -ErrorAction SilentlyContinue
          if ($files) {
            $files | ForEach-Object { Write-Host "  Found: $($_.FullName) ($([math]::Round($_.Length/1024,1)) KB)" }
          } else {
            Write-Error "No .nupkg files found in artifacts/ — pack step may have failed or produced files in a different location"
            exit 1
          }

      - name: Publish to NuGet
        shell: pwsh
        # Publish packages in dependency order: Core, Playwright, Reqnroll
        # Expand globs in PowerShell explicitly to avoid literal wildcard issues.
        run: |
          $apiKey = '${{ steps.login.outputs.NUGET_API_KEY }}'
          $nugetSource = 'https://api.nuget.org/v3/index.json'
          $order = @('NScreenplay.Core','NScreenplay.Playwright','NScreenplay.Reqnroll')

          foreach ($id in $order) {
            Write-Host "Resolving package files for: $id"
            $matches = Get-ChildItem -Path "artifacts\$id.*.nupkg" -File -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
                       Sort-Object Name
            if (-not $matches -or $matches.Count -eq 0) {
              Write-Error "No package found for id: $id in artifacts/. Aborting publish."
              exit 1
            }

            foreach ($pkg in $matches) {
              Write-Host "Validating existence of package file: $($pkg.FullName)"
              if (-not (Test-Path $pkg.FullName)) {
                Write-Error "Resolved package file does not exist: $($pkg.FullName)"
                exit 1
              }
            }

            foreach ($pkg in $matches) {
              Write-Host "Pushing package: $($pkg.FullName) to $nugetSource"
              # Use --skip-duplicate to tolerate already-published packages and fail on other errors
              dotnet nuget push $pkg.FullName --api-key $apiKey --source $nugetSource --skip-duplicate
              if ($LASTEXITCODE -ne 0) {
                Write-Error "dotnet nuget push failed for $($pkg.FullName) with exit code $LASTEXITCODE"
                exit $LASTEXITCODE
              }
            }
            Write-Host "Published all packages for: $id"
          }

