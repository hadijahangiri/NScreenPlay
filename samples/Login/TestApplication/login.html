<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding-top: 80px; background: #f0f2f5; }
    .card { background: white; padding: 32px 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); width: 320px; }
    h1 { margin: 0 0 24px; font-size: 22px; text-align: center; }
    label { display: block; margin-bottom: 4px; font-size: 14px; }
    input { width: 100%; padding: 8px 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 16px; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #1677ff; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #0958d9; }
    #error { color: #cf1322; font-size: 13px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="you@example.com" data-testid="username-input" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Password" data-testid="password-input" />
    <button id="login-btn" data-testid="login-button">Sign in</button>
    <div id="error" role="alert" data-testid="login-error">Invalid username or password.</div>
  </div>
  <script>
    // Test credentials (demo only — not real secrets)
    const VALID_USER = 'alice@example.com';
    const VALID_PASS = 'secret123';

    document.getElementById('login-btn').addEventListener('click', function () {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      if (user === VALID_USER && pass === VALID_PASS) {
        document.open();
        document.write(dashboardHtml('Welcome, Alice!'));
        document.close();
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });

    function dashboardHtml(greeting) {
      return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Dashboard</title>
      <style>body{font-family:Arial,sans-serif;display:flex;justify-content:center;padding-top:80px;background:#f0f2f5;}
      .card{background:white;padding:32px 40px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
      h1{margin:0;font-size:24px;}</style></head>
      <body><div class="card"><h1 data-testid="dashboard-heading">${greeting}</h1>
      <p>You are now logged in.</p></div></body></html>`;
    }
  </script>
</body>
</html>
